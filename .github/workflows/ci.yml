name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # addon импортирует собранный core, поэтому сборка идёт первой
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
